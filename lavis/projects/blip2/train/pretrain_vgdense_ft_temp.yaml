model:
  arch: blip2
  model_type: vg_dense
  load_pretrained: True
  load_finetuned: False
  freeze_vit: False


datasets:      
  vg_dense_caption: # name of the dataset builder
    vis_processor:
        train:
          name: "blip_image_train"
          image_size: 224   # 364 / 224
    text_processor:
        train:
          name: "blip_caption"
    build_info:
        images:
            storage: '/home/lm1/datasets/vg/images/'


run:
  task: image_text_pretrain
  # optimizer
  lr_sched: "linear_warmup_cosine_lr"
  init_lr: 1e-5    
  min_lr: 0       
  warmup_lr: 1e-8  
  warmup_steps: 1000
  weight_decay: 0.05
  max_epoch: 5          
  batch_size_train: 14   
  batch_size_eval: 16   
  lr_layer_decay: 0.95 
  num_workers: 4
  accum_grad_iters: 1 

  seed: 42
  output_dir: "output/BLIP2/Pretrain_vgdense"

  amp: True
  resume_ckpt_path: null

  evaluate: False 
  train_splits: ["train"]

  device: "cuda"
  world_size: 1
  dist_url: "env://"
  distributed: True


